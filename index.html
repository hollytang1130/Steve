<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .steve-widget { display: flex; flex-direction: column; align-items: center; margin-bottom: -6px; z-index: 1; }
    .pixel-steve { image-rendering: pixelated; width: 96px; height: 96px; }
    .steve-name { color: #e0e0e0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; margin-top: 4px; margin-bottom: 8px; }
    .chat-container { width: 400px; height: 560px; background: #16213e; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #0f3460; }
    .chat-header { background: #0f3460; padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .header-sub { font-size: 11px; color: #94a3b8; }
    .reset-btn { margin-left: auto; background: transparent; border: 1px solid #1e4080; color: #94a3b8; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    .reset-btn:hover { border-color: #94a3b8; color: #e2e8f0; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #0f3460 transparent; }
    .message { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; word-break: break-word; }
    .message.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 3px; }
    .message.steve { align-self: flex-start; background: #1e293b; color: #cbd5e1; border-bottom-left-radius: 3px; }
    .typing-indicator { align-self: flex-start; background: #1e293b; border-radius: 14px; border-bottom-left-radius: 3px; padding: 12px 16px; display: none; gap: 4px; align-items: center; }
    .typing-indicator.visible { display: flex; }
    .dot { width: 6px; height: 6px; background: #475569; border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    .input-area { padding: 12px 14px; border-top: 1px solid #0f3460; display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; background: #1e293b; border: 1px solid #0f3460; border-radius: 20px; padding: 9px 15px; font-size: 13.5px; color: #e2e8f0; outline: none; transition: border-color 0.15s; }
    input[type="text"]::placeholder { color: #475569; }
    input[type="text"]:focus { border-color: #2563eb; }
    button.send-btn { background: #2563eb; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
    button.send-btn:hover { background: #1d4ed8; }
    button.send-btn:disabled { background: #1e293b; cursor: default; }

    /* api key setup screen */
    .setup-screen { position: fixed; inset: 0; background: #1a1a2e; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .setup-box { background: #16213e; border: 1px solid #0f3460; border-radius: 16px; padding: 32px; width: 340px; display: flex; flex-direction: column; gap: 16px; }
    .setup-box h2 { color: #e2e8f0; font-size: 16px; }
    .setup-box p { color: #94a3b8; font-size: 13px; line-height: 1.5; }
    .setup-box a { color: #60a5fa; }
    .setup-box input { background: #1e293b; border: 1px solid #0f3460; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #e2e8f0; outline: none; width: 100%; }
    .setup-box input:focus { border-color: #2563eb; }
    .setup-box button { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .setup-box button:hover { background: #1d4ed8; }
    .setup-box .error { color: #f87171; font-size: 12px; display: none; }
  </style>
</head>
<body>

  <!-- API key setup (shown if no key saved) -->
  <div class="setup-screen" id="setup">
    <div class="setup-box">
      <h2>one-time setup</h2>
      <p>get a free API key from <a href="https://console.groq.com" target="_blank">console.groq.com</a> (no credit card needed) then paste it below</p>
      <input type="password" id="keyInput" placeholder="gsk_..." />
      <div class="error" id="keyError">invalid key, try again</div>
      <button onclick="saveKey()">let's go</button>
    </div>
  </div>

  <div class="steve-widget">
    <svg class="pixel-steve" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <rect x="4" y="0" width="8" height="1" fill="#c0392b"/>
      <rect x="3" y="1" width="10" height="1" fill="#c0392b"/>
      <rect x="3" y="2" width="10" height="1" fill="#c0392b"/>
      <rect x="3" y="3" width="1" height="3" fill="#c0392b"/>
      <rect x="12" y="3" width="1" height="3" fill="#c0392b"/>
      <rect x="4" y="3" width="8" height="5" fill="#f4c5a0"/>
      <rect x="4" y="5" width="3" height="2" fill="#2c2c2c"/>
      <rect x="9" y="5" width="3" height="2" fill="#2c2c2c"/>
      <rect x="5" y="5" width="2" height="2" fill="#a8d8ea"/>
      <rect x="10" y="5" width="2" height="2" fill="#a8d8ea"/>
      <rect x="7" y="6" width="2" height="1" fill="#2c2c2c"/>
      <rect x="6" y="7" width="1" height="1" fill="#c0826a"/>
      <rect x="9" y="7" width="1" height="1" fill="#c0826a"/>
      <rect x="7" y="8" width="2" height="1" fill="#c0826a"/>
      <rect x="6" y="8" width="4" height="1" fill="#f4c5a0"/>
      <rect x="2" y="9" width="12" height="7" fill="#374151"/>
      <rect x="4" y="9" width="8" height="1" fill="#4b5563"/>
      <rect x="3" y="9" width="1" height="2" fill="#4b5563"/>
      <rect x="12" y="9" width="1" height="2" fill="#4b5563"/>
      <rect x="5" y="12" width="6" height="3" fill="#4b5563"/>
      <rect x="0" y="9" width="2" height="6" fill="#374151"/>
      <rect x="14" y="9" width="2" height="6" fill="#374151"/>
      <rect x="0" y="15" width="2" height="1" fill="#f4c5a0"/>
      <rect x="14" y="15" width="2" height="1" fill="#f4c5a0"/>
    </svg>
    <div class="steve-name">Steve</div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="status-dot"></div>
      <div>
        <div class="header-title">Steve McLaughlin</div>
        <div class="header-sub">civil engineer · cat dad · poisson steve</div>
      </div>
      <button class="reset-btn" onclick="resetChat()">new chat</button>
    </div>
    <div class="messages" id="messages">
      <div class="message steve">yo what's up</div>
    </div>
    <div class="typing-indicator" id="typing">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="input-area">
      <input type="text" id="input" placeholder="message steve..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `You are Steve McLaughlin, a civil engineer at a firm. You're being messaged by your coworker on Zoom chat. You are the real Steve — respond authentically.

WHO STEVE IS:
- Ginger guy, wears Converses, square glasses, usually in a hoodie
- Plays piano and is into music
- Has a gray male cat named Bailey who he will randomly send pics of mid-conversation
- Loves snacks, genuinely
- Very good at CAD — like, scary good
- White guy who makes fun of white people, very self-aware about it in a funny way
- Quirky and funny in a weird specific way, not performatively funny
- Genuinely cares about coworkers, especially newer ones — patient, helpful, never condescending
- Very chill. Nothing rattles him except Paul asking for plan sets 30 mins before a meeting

COMMUNICATION STYLE:
- Short. Very short. One line usually. Sometimes just one word.
- Lowercase almost always. Correct grammar is optional.
- Dry wit. Deadpan. Doesn't explain the joke.
- "ya", "yep", "nah", "p decent", "lol", "wdym", "idt", "tbh"
- Will randomly reference Bailey or send "[pic of Bailey]" when the mood strikes
- Makes Poisson distribution jokes (inside joke — "poisson steve" is a thing)
- Will roast white people behavior with zero hesitation (he is white, that's the bit)
- Gets mildly exasperated at Paul (demands plans 30 mins before meetings) and Joe (edits CAD files without telling anyone — "WHY JOE WHY")

REAL PHRASES: "i was hiding", "ahem sad slide whistle", "me too cats, me too", "looks p decent", "WHY JOE WHY", "twice as nice"

Keep replies SHORT. Zoom chat energy. Don't bullet point. Don't over-explain. Be Steve.`;

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const typing = document.getElementById("typing");
    const setup = document.getElementById("setup");

    let history = [];

    // check for saved key
    if (localStorage.getItem("groq_key")) setup.style.display = "none";

    document.getElementById("keyInput").addEventListener("keydown", e => {
      if (e.key === "Enter") saveKey();
    });

    async function saveKey() {
      const key = document.getElementById("keyInput").value.trim();
      if (!key.startsWith("gsk_")) {
        document.getElementById("keyError").style.display = "block";
        return;
      }
      localStorage.setItem("groq_key", key);
      setup.style.display = "none";
      inputEl.focus();
    }

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage(text, "user");
      history.push({ role: "user", content: text });

      messagesEl.appendChild(typing);
      typing.classList.add("visible");
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${localStorage.getItem("groq_key")}`
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            max_tokens: 256,
            messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history]
          })
        });

        if (res.status === 401) {
          localStorage.removeItem("groq_key");
          setup.style.display = "flex";
          document.getElementById("keyError").style.display = "block";
          typing.classList.remove("visible");
          history.pop();
          sendBtn.disabled = false;
          return;
        }

        const data = await res.json();
        const reply = data.choices[0].message.content;
        history.push({ role: "assistant", content: reply });
        typing.classList.remove("visible");
        addMessage(reply, "steve");
      } catch {
        typing.classList.remove("visible");
        history.pop();
        addMessage("something went wrong, try again", "steve");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = `<div class="message steve">yo what's up</div>`;
    }
  </script>
</body>
</html>
