<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
    }

    /* ── pixel steve ── */
    .steve-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -6px;
      z-index: 1;
    }

    .pixel-steve {
      image-rendering: pixelated;
      width: 96px;
      height: 96px;
    }

    .steve-name {
      color: #e0e0e0;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.5;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    /* ── chat box ── */
    .chat-container {
      width: 400px;
      height: 560px;
      background: #16213e;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #0f3460;
    }

    .chat-header {
      background: #0f3460;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .header-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .reset-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid #1e4080;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .reset-btn:hover { border-color: #94a3b8; color: #e2e8f0; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: #0f3460 transparent;
    }

    .message {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.45;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.steve {
      align-self: flex-start;
      background: #1e293b;
      color: #cbd5e1;
      border-bottom-left-radius: 3px;
    }

    .typing-indicator {
      align-self: flex-start;
      background: #1e293b;
      border-radius: 14px;
      border-bottom-left-radius: 3px;
      padding: 12px 16px;
      display: none;
      gap: 4px;
      align-items: center;
    }
    .typing-indicator.visible { display: flex; }

    .dot {
      width: 6px; height: 6px;
      background: #475569;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .input-area {
      padding: 12px 14px;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: #1e293b;
      border: 1px solid #0f3460;
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 13.5px;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]::placeholder { color: #475569; }
    input[type="text"]:focus { border-color: #2563eb; }

    button.send-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    button.send-btn:hover { background: #1d4ed8; }
    button.send-btn:disabled { background: #1e293b; cursor: default; }
  </style>
</head>
<body>

  <div class="steve-widget">
    <!-- pixel art ginger Steve: hoodie, square glasses, ginger hair -->
    <svg class="pixel-steve" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <!-- ginger hair top -->
      <rect x="4" y="0" width="8" height="1" fill="#c0392b"/>
      <rect x="3" y="1" width="10" height="1" fill="#c0392b"/>
      <rect x="3" y="2" width="10" height="1" fill="#c0392b"/>
      <!-- sideburns -->
      <rect x="3" y="3" width="1" height="3" fill="#c0392b"/>
      <rect x="12" y="3" width="1" height="3" fill="#c0392b"/>
      <!-- face -->
      <rect x="4" y="3" width="8" height="5" fill="#f4c5a0"/>
      <!-- square glasses frames -->
      <rect x="4" y="5" width="3" height="2" fill="#2c2c2c"/>
      <rect x="9" y="5" width="3" height="2" fill="#2c2c2c"/>
      <!-- lens fill (lighter) -->
      <rect x="5" y="5" width="2" height="2" fill="#a8d8ea"/>
      <rect x="10" y="5" width="2" height="2" fill="#a8d8ea"/>
      <!-- nose bridge -->
      <rect x="7" y="6" width="2" height="1" fill="#2c2c2c"/>
      <!-- small smile -->
      <rect x="6" y="7" width="1" height="1" fill="#c0826a"/>
      <rect x="9" y="7" width="1" height="1" fill="#c0826a"/>
      <rect x="7" y="8" width="2" height="1" fill="#c0826a"/>
      <!-- neck -->
      <rect x="6" y="8" width="4" height="1" fill="#f4c5a0"/>
      <!-- hoodie body — dark gray -->
      <rect x="2" y="9" width="12" height="7" fill="#374151"/>
      <!-- hoodie hood/collar -->
      <rect x="4" y="9" width="8" height="1" fill="#4b5563"/>
      <rect x="3" y="9" width="1" height="2" fill="#4b5563"/>
      <rect x="12" y="9" width="1" height="2" fill="#4b5563"/>
      <!-- hoodie pocket -->
      <rect x="5" y="12" width="6" height="3" fill="#4b5563"/>
      <!-- arms -->
      <rect x="0" y="9" width="2" height="6" fill="#374151"/>
      <rect x="14" y="9" width="2" height="6" fill="#374151"/>
      <!-- hands -->
      <rect x="0" y="15" width="2" height="1" fill="#f4c5a0"/>
      <rect x="14" y="15" width="2" height="1" fill="#f4c5a0"/>
    </svg>
    <div class="steve-name">Steve</div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="status-dot"></div>
      <div>
        <div class="header-title">Steve McLaughlin</div>
        <div class="header-sub">civil engineer · cat dad · poisson steve</div>
      </div>
      <button class="reset-btn" onclick="resetChat()">new chat</button>
    </div>

    <div class="messages" id="messages">
      <div class="message steve">yo what's up</div>
    </div>

    <div class="typing-indicator" id="typing">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="message steve..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const typing = document.getElementById("typing");

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage(text, "user");

      messagesEl.appendChild(typing);
      typing.classList.add("visible");
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        typing.classList.remove("visible");
        addMessage(data.reply || data.error, "steve");
      } catch {
        typing.classList.remove("visible");
        addMessage("lol something broke, try again", "steve");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    async function resetChat() {
      await fetch("/reset", { method: "POST" });
      messagesEl.innerHTML = `<div class="message steve">yo what's up</div>`;
    }
  </script>
</body>
</html>
