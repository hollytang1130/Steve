<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 420px;
      height: 640px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1a73e8;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-info h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .header-info .status {
      font-size: 12px;
      opacity: 0.8;
    }

    .reset-btn {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .reset-btn:hover { background: rgba(255,255,255,0.3); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.steve {
      align-self: flex-start;
      background: #f1f3f4;
      color: #202124;
      border-bottom-left-radius: 4px;
    }

    .message.steve .sender {
      font-size: 11px;
      font-weight: 600;
      color: #1a73e8;
      margin-bottom: 4px;
    }

    .typing-indicator {
      align-self: flex-start;
      background: #f1f3f4;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: none;
    }

    .typing-indicator.visible { display: flex; gap: 4px; align-items: center; }

    .dot {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #e8eaed;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid #dadce0;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: #1a73e8; }

    button.send-btn {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    button.send-btn:hover { background: #1557b0; }
    button.send-btn:disabled { background: #c5cae9; cursor: default; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🧑‍💻</div>
      <div class="header-info">
        <h2>Steve</h2>
        <div class="status">● Online (probably procrastinating)</div>
      </div>
      <button class="reset-btn" onclick="resetChat()">New chat</button>
    </div>

    <div class="messages" id="messages">
      <div class="message steve">
        <div class="sender">Steve</div>
        yo what's up
      </div>
    </div>

    <div class="typing-indicator" id="typing">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Message Steve..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const typing = document.getElementById("typing");

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      if (role === "steve") {
        div.innerHTML = `<div class="sender">Steve</div>${escapeHtml(text)}`;
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage(text, "user");

      typing.classList.add("visible");
      messagesEl.appendChild(typing);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        typing.classList.remove("visible");
        addMessage(data.reply || data.error, "steve");
      } catch (err) {
        typing.classList.remove("visible");
        addMessage("lol something broke on my end, try again", "steve");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    async function resetChat() {
      await fetch("/reset", { method: "POST" });
      messagesEl.innerHTML = `
        <div class="message steve">
          <div class="sender">Steve</div>
          yo what's up
        </div>`;
    }
  </script>
</body>
</html>
